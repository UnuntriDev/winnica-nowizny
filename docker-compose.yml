services:
  wordpress:
    image: wordpress:7.0.2-php8.2-apache
    container_name: winnica-wp
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: winnica
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?ustaw WORDPRESS_DB_PASSWORD w pliku .env (wzor w .env.example)}
      WORDPRESS_DB_NAME: winnica
      WORDPRESS_DEBUG: ${WINNICA_WP_DEBUG:-}
      WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-local}
      WINNICA_SMTP_HOST: ${WINNICA_SMTP_HOST:-}
      WINNICA_SMTP_PORT: ${WINNICA_SMTP_PORT:-587}
      WINNICA_SMTP_USER: ${WINNICA_SMTP_USER:-}
      WINNICA_SMTP_PASS: ${WINNICA_SMTP_PASS:-}
      WINNICA_SMTP_ENCRYPTION: ${WINNICA_SMTP_ENCRYPTION:-tls}
      WINNICA_SMTP_FROM_EMAIL: ${WINNICA_SMTP_FROM_EMAIL:-}
      WINNICA_SMTP_FROM_NAME: ${WINNICA_SMTP_FROM_NAME:-Winnica Nowizny}
      WINNICA_RELEASE: ${WINNICA_RELEASE:-local}
      WINNICA_TRUSTED_PROXY_CIDRS: ${WINNICA_TRUSTED_PROXY_CIDRS:-}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', WP_DEBUG ? 'php://stderr' : false);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', WP_DEBUG);
        define('WP_ENVIRONMENT_TYPE', getenv('WP_ENVIRONMENT_TYPE') ?: 'local');
    volumes:
      - wp_data:/var/www/html
      - ./wp-theme/winnica-nowizny:/var/www/html/wp-content/themes/winnica-nowizny
      - ./plugins:/var/www/html/wp-content/plugins
      - ./uploads:/var/www/html/wp-content/uploads
      - ./setup/apache-security.conf:/etc/apache2/conf-enabled/winnica-security.conf:ro
      - ./setup/php-hardening.ini:/usr/local/etc/php/conf.d/winnica-hardening.ini:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/wp-json/winnica/v1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 45s

  db:
    image: mariadb:11
    container_name: winnica-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: winnica
      MYSQL_USER: winnica
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:?ustaw WORDPRESS_DB_PASSWORD w pliku .env (wzor w .env.example)}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?ustaw MYSQL_ROOT_PASSWORD w pliku .env (wzor w .env.example)}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5

  wpcli:
    image: wordpress:cli-php8.2
    container_name: winnica-cli
    # The Apache image stores the shared volume as Debian www-data (33).
    # The Alpine CLI image uses a different www-data UID, so align it explicitly.
    user: "33:33"
    volumes:
      - wp_data:/var/www/html
      - ./wp-theme/winnica-nowizny:/var/www/html/wp-content/themes/winnica-nowizny
      - ./plugins:/var/www/html/wp-content/plugins
      - ./uploads:/var/www/html/wp-content/uploads
      - ./setup:/setup
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: winnica
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?ustaw WORDPRESS_DB_PASSWORD w pliku .env (wzor w .env.example)}
      WORDPRESS_DB_NAME: winnica
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@winnicanowizny.local}
      WP_URL: ${WP_URL:-http://localhost:8080}
      WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-local}
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command: ["echo 'WP-CLI ready. Use: docker compose run wpcli wp ...'"]
    profiles:
      - cli

volumes:
  wp_data:
  db_data:
