services:
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile.wordpress
    image: winnica-nowizny:${WINNICA_RELEASE:?ustaw WINNICA_RELEASE na identyfikator commita lub wydania}
    restart: unless-stopped
    expose:
      - "80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: winnica
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:?ustaw WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: winnica
      WORDPRESS_DEBUG: "0"
      WP_ENVIRONMENT_TYPE: production
      WP_HOME: ${WP_URL:?ustaw produkcyjny adres HTTPS w WP_URL}
      WP_SITEURL: ${WP_URL:?ustaw produkcyjny adres HTTPS w WP_URL}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:?ustaw potwierdzony WP_ADMIN_EMAIL}
      WINNICA_RELEASE: ${WINNICA_RELEASE:?ustaw WINNICA_RELEASE}
      WINNICA_TRUSTED_PROXY_CIDRS: ${WINNICA_TRUSTED_PROXY_CIDRS:?ustaw adresy zaufanego reverse proxy}
      WINNICA_SMTP_HOST: ${WINNICA_SMTP_HOST:?ustaw WINNICA_SMTP_HOST}
      WINNICA_SMTP_PORT: ${WINNICA_SMTP_PORT:-587}
      WINNICA_SMTP_USER: ${WINNICA_SMTP_USER:?ustaw WINNICA_SMTP_USER}
      WINNICA_SMTP_PASS: ${WINNICA_SMTP_PASS:?ustaw WINNICA_SMTP_PASS}
      WINNICA_SMTP_ENCRYPTION: ${WINNICA_SMTP_ENCRYPTION:-tls}
      WINNICA_SMTP_FROM_EMAIL: ${WINNICA_SMTP_FROM_EMAIL:?ustaw WINNICA_SMTP_FROM_EMAIL}
      WINNICA_SMTP_FROM_NAME: ${WINNICA_SMTP_FROM_NAME:-Winnica Nowizny}
      WINNICA_GA_ID: ${WINNICA_GA_ID:-}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG_LOG', false);
        define('WP_DEBUG_DISPLAY', false);
        define('SCRIPT_DEBUG', false);
        define('WP_ENVIRONMENT_TYPE', 'production');
        define('DISALLOW_FILE_EDIT', true);
        define('FORCE_SSL_ADMIN', true);
        define('WINNICA_RELEASE', getenv('WINNICA_RELEASE'));
        define('WINNICA_TRUSTED_PROXY_CIDRS', getenv('WINNICA_TRUSTED_PROXY_CIDRS'));
        if (($_SERVER['HTTP_X_FORWARDED_PROTO'] ?? '') === 'https') {
            $_SERVER['HTTPS'] = 'on';
        }
    volumes:
      - uploads_data:/var/www/html/wp-content/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - edge
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/wp-json/winnica/v1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 45s

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: winnica
      MYSQL_USER: winnica
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:?ustaw WORDPRESS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?ustaw MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 8

volumes:
  db_data:
  uploads_data:

networks:
  internal:
    internal: true
  edge:
    external: true
    name: ${EDGE_NETWORK_NAME:?ustaw EDGE_NETWORK_NAME reverse proxy}
